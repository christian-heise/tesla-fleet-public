<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Authorization code</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6;
               color: #18181b; background: #ffffff; }
        code { display: block; word-break: break-all; padding: 1rem; margin: 1rem 0;
               background: #f4f4f5; border-radius: 6px; font-size: 0.95rem; }
        .note { color: #6b7280; font-size: 0.9rem; }
        @media (prefers-color-scheme: dark) {
            body { color: #e4e4e7; background: #18181b; }
            code { background: #27272a; }
            .note { color: #a1a1aa; }
        }
    </style>
</head>
<body>
    <h1>Authorization code</h1>
    <!--
      OAuth redirect target for a private Tesla Fleet API integration.

      Deliberately inert: it reads the query string and renders it, and makes no
      network request of any kind. The authorization code is short-lived,
      single-use, and worthless without the application secret -- but it is still
      a credential, so nothing here transmits, stores, or logs it.
    -->
    <p>Copy the code below into the terminal running the setup runbook.</p>
    <code id="code">No code in this URL.</code>
    <p id="state" class="note"></p>
    <p class="note">Single-use and short-lived. If the exchange fails, start the
       authorization again rather than reusing it.</p>
    <script>
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error");
        var state = params.get("state");
        if (code) {
            document.getElementById("code").textContent = code;
        } else if (error) {
            document.getElementById("code").textContent =
                "Authorization failed: " + error;
        }
        if (state) {
            document.getElementById("state").textContent = "state: " + state;
        }
    </script>
</body>
</html>
